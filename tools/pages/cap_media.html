<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>media state</title>
<style>body { margin: 0 } #host { width: 800px }</style>
</head>
<body>
<div id="host"></div>
<video id="v"></video>
<script>
window.reportMedia = function () {
  var out = [];
  function d(k, v) { out.push(k + '=' + v); }
  var v = document.createElement('video');
  var a = document.createElement('audio');

  /* --- construction / identity --------------------------------------- */
  d('tag', v.tagName + '/' + a.tagName);
  d('ctor', v.constructor.name + '/' + a.constructor.name);
  d('methods', [typeof v.play, typeof v.pause, typeof v.load, typeof v.canPlayType,
                typeof v.addTextTrack].join(','));
  d('canPlay', [v.canPlayType('video/mp4'), v.canPlayType('video/webm'),
                v.canPlayType('video/ogg'), v.canPlayType('application/x-mpegURL'),
                v.canPlayType(''), v.canPlayType('bogus/x')].join('|'));

  /* --- initial state -------------------------------------------------- */
  d('init', 'paused=' + (v.paused ? 1 : 0) + ' ended=' + (v.ended ? 1 : 0) + ' rs=' + v.readyState
            + ' ns=' + v.networkState + ' ct=' + v.currentTime + ' dur=' + v.duration
            + ' vol=' + v.volume + ' muted=' + v.muted);

  /* --- geometry ------------------------------------------------------- */
  var lit = document.getElementById('v');
  var litRect = lit.getBoundingClientRect();
  d('defaultBox', Math.round(litRect.width) + 'x' + Math.round(litRect.height));
  v.style.width = '320px';
  v.style.height = '180px';
  document.getElementById('host').appendChild(v);
  var hostRect = v.getBoundingClientRect();
  d('mountedBox', Math.round(hostRect.width) + 'x' + Math.round(hostRect.height)
                  + ' computed=' + getComputedStyle(v).width + '/' + getComputedStyle(v).height);
  d('offset', v.offsetWidth + 'x' + v.offsetHeight);

  /* --- audio visibility ------------------------------------------------ */
  var a2 = document.createElement('audio');
  a2.controls = true;
  document.getElementById('host').appendChild(a2);
  var aRect = a2.getBoundingClientRect();
  d('audioControls', Math.round(aRect.width) + 'x' + Math.round(aRect.height)
                     + ' display=' + getComputedStyle(a2).display);
  a2.controls = false;
  d('audioNoControls', getComputedStyle(a2).display);

  /* --- textTracks ------------------------------------------------------ */
  var track = v.addTextTrack('subtitles', 'English', 'en');
  d('tracks', v.textTracks.length + ':' + (track ? track.kind + '/' + track.label + '/' + track.language : 'null'));

  return out.join(' ');
};
</script>
</body>
</html>
