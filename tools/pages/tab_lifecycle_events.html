<html><head><title>tab-lifecycle-events</title>
<script>

 * both before "realm stop". */
window.addEventListener('pagehide', function () {});
window.addEventListener('unload', function () {});
document.addEventListener('visibilitychange', function () {});
</script>
</head>

</body></html>
