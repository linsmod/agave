<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>resize probe</title>
<style>
  html, body { margin: 0; padding: 0; }
  /* Viewport units are document variables now (var(--agb-v...)), so these
   * follow a window resize; they used to be px baked at parse time (R53). */
  #vw { width: 100vw; height: 50vh; background: rgb(0, 0, 200); }
  /* Percentages resolve during layout, so this one must follow a resize. */
  #pct { width: 50%; height: 10px; background: rgb(0, 200, 0); }
  /* A media breakpoint: does the CSS cascade re-evaluate @media on resize? */
  #mq { width: 10px; height: 10px; background: rgb(10, 20, 30); }
  @media (max-width: 600px) {
    #mq { background: rgb(200, 30, 40); }
  }
  /* calc() with viewport units: the 2008 grammar cannot parse calc() with a
   * var() inside, so this used to be dropped as soon as the units became
   * symbolic. */
  #calc { width: calc(100vw - 100px); height: calc(50vh - 50px); }
  /* The mirror case: matches at the initial 1100px viewport and must stop
   * matching after a shrink to 500px, if @media is live at all. */
  #mq-wide { width: 10px; height: 10px; background: rgb(40, 30, 20); }
  @media (min-width: 900px) {
    #mq-wide { background: rgb(30, 200, 40); }
  }
  /* rem breakpoints (R165 follow-up): a media-query rem is relative to the
   * initial 16px, not to the root element. At the 500x400 resize 20rem=320px
   * matches and 40rem=640px does not. Before the fix the 2008 media-query
   * grammar could not parse the unit and every such query matched. */
  #mq-rem      { width: 10px; height: 10px; background: rgb(1, 2, 3); }
  #mq-rem-wide { width: 10px; height: 10px; background: rgb(3, 4, 5); }
  @media (min-width: 20rem) { #mq-rem { background: rgb(2, 60, 120); } }
  @media (min-width: 40rem) { #mq-rem-wide { background: rgb(120, 60, 2); } }
</style>
</head>
<body onresize="document.documentElement.setAttribute('data-attr-resize', String(window.innerWidth) + 'x' + String(window.innerHeight));">
<div id="vw"></div>
<div id="pct"></div>
<div id="mq"></div>
<div id="calc"></div>
<div id="mq-wide"></div>
<div id="mq-rem"></div>
<div id="mq-rem-wide"></div>
<script>
  window.__resizeLog = [];
  window.addEventListener('resize', function () {
    window.__resizeLog.push(window.innerWidth + 'x' + window.innerHeight);
  });
  window.onresize = function () {
    window.__propLog = window.__propLog || [];
    window.__propLog.push(window.innerWidth);
  };
</script>
</body>
</html>
