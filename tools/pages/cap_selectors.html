<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>cap selectors</title>
</head>
<body>
<div id="host"></div>
<script>
var d = document.createElement('div');
d.id = 'probe';
d.className = 'probe-cls';
d.dataset.foo = 'bar';
d.setAttribute('data-bar', 'baz');
document.getElementById('host').appendChild(d);

document.title = [
  'attr=' + String(d.getAttribute('data-foo')),
  'ds=' + String(d.dataset.foo),
  'qsAttr=' + document.querySelectorAll('[data-bar]').length,
  'qsClass=' + document.querySelectorAll('.probe-cls').length,
  'qsClassAttr=' + document.querySelectorAll('[class*=probe]').length,
  'qsTagAttr=' + document.querySelectorAll('div[data-bar]').length
].join(' ');
</script>
</body>
</html>
