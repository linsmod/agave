<!DOCTYPE html>
<html>
<head>
<!-- No meta charset at all: only the HTTP header can decide (www.163.com
     article pages put their <meta charset> far below the head, so the
     transport header is the only signal a browser can use). -->
<meta name="expect-title" content="NOMETA-UTF8-标题">
<meta name="expect-charset" content="UTF-8">
<title>NOMETA-UTF8-标题</title>
</head>
<body><p>正文-只有响应头</p></body>
</html>
