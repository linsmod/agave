<!DOCTYPE html>
<html>
<head>
<!-- No charset in the response header; the body is GBK and the meta says so.
     With no transport charset the meta is the deciding signal. -->
<meta http-equiv="Content-Type" content="text/html; charset=gbk">
<meta name="expect-title" content="META-GBK-标题">
<meta name="expect-charset" content="GBK">
<title>META-GBK-标题</title>
</head>
<body><p>正文-meta 决定</p></body>
</html>
