<!DOCTYPE html>
<html>
<head>
<!-- This file is UTF-8 on disk. The server sends
     `Content-Type: text/html; charset=utf-8`, so the transport charset must win
     over this stale meta (renjian.163.com is exactly this shape). -->
<meta http-equiv="Content-Type" content="text/html; charset=gbk">
<meta name="expect-title" content="UTF8-标题">
<meta name="expect-charset" content="UTF-8">
<title>UTF8-标题</title>
</head>
<body><p>正文-UTF8</p></body>
</html>
