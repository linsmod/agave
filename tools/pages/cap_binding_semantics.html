<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>binding semantics</title></head>
<body>
<div id="d">d</div><input id="i"><span id="s">s</span>
<script>
/* DOM binding semantics matrix (B1: interface prototypes, constructors,
 * @@toStringTag, method ownership, descriptors, facade behaviour).
 *
 * Every assertion is a pair of the same JS a browser runs; run_binding_
 * semantics_tests.ps1 checks that all of them pass and the page never threw.
 * The expected values are the ones Chrome returns (see
 * issues/wip/ant-dom-bindings.md §12); a "known gap" assertion documents a
 * difference that a later stage (B2/A) is expected to flip. */
(function () {
  var pass = 0, fail = [], total = 0;

  function ok(name, cond) {
    total++;
    if (cond) { pass++; } else { fail.push(name); }
  }

  function protoIs(a, b) { return Object.getPrototypeOf(a) === b; }

  var div = document.getElementById('d');
  var input = document.getElementById('i');
  var span = document.getElementById('s');
  var text = document.createTextNode('t');
  var comment = document.createComment('c');
  var frag = document.createDocumentFragment();

  try {
    /* ---- prototype chain -------------------------------------------------- */
    ok('div proto', protoIs(div, HTMLDivElement.prototype));
    ok('div parent proto', protoIs(HTMLDivElement.prototype, HTMLElement.prototype));
    ok('html parent proto', protoIs(HTMLElement.prototype, Element.prototype));
    ok('element parent proto', protoIs(Element.prototype, Node.prototype));
    ok('node parent proto', protoIs(Node.prototype, EventTarget.prototype));
    ok('event-target root', protoIs(EventTarget.prototype, Object.prototype));

    /* ---- instanceof ------------------------------------------------------- */
    ok('div instanceof HTMLDivElement', div instanceof HTMLDivElement);
    ok('div instanceof HTMLElement', div instanceof HTMLElement);
    ok('div instanceof Element', div instanceof Element);
    ok('div instanceof Node', div instanceof Node);
    ok('div instanceof EventTarget', div instanceof EventTarget);
    ok('div instanceof Object', div instanceof Object);
    ok('div !instanceof HTMLInputElement', !(div instanceof HTMLInputElement));
    ok('div !instanceof HTMLSpanElement', !(div instanceof HTMLSpanElement));
    ok('input instanceof HTMLInputElement', input instanceof HTMLInputElement);
    ok('span instanceof HTMLSpanElement', span instanceof HTMLSpanElement);
    ok('document instanceof HTMLDocument', document instanceof HTMLDocument);
    ok('document instanceof Document', document instanceof Document);
    ok('document instanceof Node', document instanceof Node);
    ok('document instanceof EventTarget', document instanceof EventTarget);
    ok('document !instanceof HTMLElement', !(document instanceof HTMLElement));

    /* ---- constructors / toString ----------------------------------------- */
    ok('div constructor', div.constructor === HTMLDivElement);
    ok('div constructor name', div.constructor.name === 'HTMLDivElement');
    ok('div toString', Object.prototype.toString.call(div) === '[object HTMLDivElement]');
    ok('document toString', Object.prototype.toString.call(document) === '[object HTMLDocument]');
    ok('document constructor', document.constructor === HTMLDocument);
    ok('interface ctor inherits', protoIs(HTMLDivElement, HTMLElement));
    ok('interface name', HTMLDivElement.name === 'HTMLDivElement');

    /* ---- text / comment / fragment --------------------------------------- */
    ok('text constructor', text.constructor === Text);
    ok('text instanceof CharacterData', text instanceof CharacterData);
    ok('text instanceof Node', text instanceof Node);
    ok('text !instanceof Element', !(text instanceof Element));
    ok('comment constructor', comment.constructor === Comment);
    ok('fragment constructor', frag.constructor === DocumentFragment);
    ok('fragment instanceof Node', frag instanceof Node);
    ok('fragment !instanceof Element', !(frag instanceof Element));

    /* ---- method ownership -------------------------------------------------- */
    ok('Node.prototype.appendChild', typeof Node.prototype.appendChild === 'function');
    ok('Node.prototype.getRootNode', typeof Node.prototype.getRootNode === 'function');
    ok('Element.prototype.querySelector', typeof Element.prototype.querySelector === 'function');
    ok('Element.prototype.getAttribute', typeof Element.prototype.getAttribute === 'function');
    ok('Node.prototype.querySelector absent', Node.prototype.querySelector === undefined);
    ok('HTMLElement.prototype.focus', typeof HTMLElement.prototype.focus === 'function');
    ok('Element.prototype.focus absent', Element.prototype.focus === undefined);
    ok('HTMLElement.prototype.click', typeof HTMLElement.prototype.click === 'function');
    ok('HTMLFormElement.prototype.submit', typeof HTMLFormElement.prototype.submit === 'function');
    ok('HTMLCanvasElement.prototype.getContext', typeof HTMLCanvasElement.prototype.getContext === 'function');
    ok('HTMLMediaElement.prototype.play', typeof HTMLMediaElement.prototype.play === 'function');
    ok('Document.prototype.getElementById', typeof Document.prototype.getElementById === 'function');
    ok('Document.prototype.getElementsByTagName', typeof Document.prototype.getElementsByTagName === 'function');
    ok('assigned method works', typeof div.appendChild === 'function' && typeof div.getAttribute === 'function');

    /* ---- constants --------------------------------------------------------- */
    ok('Node.ELEMENT_NODE', Node.ELEMENT_NODE === 1);
    ok('Node.TEXT_NODE', Node.TEXT_NODE === 3);
    ok('Node.DOCUMENT_NODE', Node.DOCUMENT_NODE === 9);
    ok('inherited constant', HTMLDivElement.ELEMENT_NODE === 1);

    /* ---- descriptors (WebIDL shape) --------------------------------------- */
    (function () {
      var d = Object.getOwnPropertyDescriptor(HTMLElement, 'prototype');
      ok('ctor prototype attrs', !!d && d.writable === false && d.enumerable === false && d.configurable === false);
    })();
    (function () {
      var d = Object.getOwnPropertyDescriptor(HTMLDivElement.prototype, 'constructor');
      ok('prototype constructor attrs', !!d && d.writable === true && d.enumerable === false && d.configurable === true);
    })();
    ok('prototype @@toStringTag', HTMLDivElement.prototype[Symbol.toStringTag] === 'HTMLDivElement');

    /* ---- illegal constructor ---------------------------------------------- */
    (function () {
      var threw = false;
      try { new HTMLElement(); } catch (e) {
        threw = (e instanceof TypeError) && /Illegal constructor/.test(e.message);
      }
      ok('new HTMLElement throws', threw);
    })();
    (function () {
      var threw = false;
      try { HTMLDivElement(); } catch (e) { threw = true; }
      ok('calling interface throws', threw);
    })();

    /* ---- facade still the custom layer ------------------------------------ */
    div.id = 'd2';
    ok('id setter', div.getAttribute('id') === 'd2');
    div.id = 'd';
    div.className = 'cls';
    ok('class setter', div.getAttribute('class') === 'cls');
    input.value = 'abc';
    ok('input value property', input.value === 'abc');
    div.onclick = function () {};
    ok('onclick property', typeof div.onclick === 'function');
    ok('hasOwnProperty false', div.hasOwnProperty('id') === false && div.hasOwnProperty('nope') === false);
    ok('in operator', ('appendChild' in div) && ('tagName' in div));
    ok('for-in lists methods', (function () {
      for (var k in div) { if (k === 'appendChild') return true; }
      return false;
    })());
    ok('wrapper identity', document.getElementById('d') === div);
    ok('ownerDocument identity', div.ownerDocument === document);

    /* ---- polyfills on the right prototypes -------------------------------- */
    var p = document.createElement('p');
    document.body.appendChild(p);
    p.appendChild(text);
    ok('text.remove present', typeof text.remove === 'function');
    text.remove();
    ok('text.remove works', text.parentNode === null);
    p.append('x');
    ok('append works', p.childNodes.length >= 1);
    ok('matches on Element', typeof div.matches === 'function' && div.matches('#d'));

    /* ---- document API ------------------------------------------------------ */
    ok('getElementById', document.getElementById('i') === input);
    ok('querySelector', document.querySelector('#d') === div);
    ok('querySelectorAll', document.querySelectorAll('div').length >= 1);
    document.title = 'binding';
    ok('title getter/setter', document.title === 'binding');
    ok('readyState string', typeof document.readyState === 'string');

    /* ---- already-wrapped classes ------------------------------------------ */
    /* element.style is still the facade's plain shim (known gap): it reflects
     * CSS properties but is not a CSSStyleDeclaration interface instance yet. */
    div.style.color = 'red';
    ok('style shim write', div.style.color === 'red');
    ok('style is object (known gap)', typeof div.style === 'object' &&
       !(div.style instanceof CSSStyleDeclaration));
    ok('StyleSheetList global', typeof StyleSheetList === 'function');
    ok('selection instanceof Selection', window.getSelection() instanceof Selection);
    ok('range instanceof Range', document.createRange() instanceof Range);
    (function () {
      var canvas = document.createElement('canvas');
      canvas.width = 8; canvas.height = 8;
      var ctx = canvas.getContext('2d');
      ok('canvas ctx instanceof', ctx instanceof CanvasRenderingContext2D);
      ok('canvas ctx proto', protoIs(ctx, CanvasRenderingContext2D.prototype));
    })();

    /* ---- B2: NodeList / HTMLCollection (Chrome values: issues §19）-------- */
    (function () {
      var host = document.createElement('div');
      var p1 = document.createElement('p');
      var p2 = document.createElement('p');
      var span = document.createElement('span');
      p1.id = 'p1'; p2.id = 'p2'; span.id = 's1';
      p1.className = 'a b';
      host.appendChild(p1);
      host.appendChild(p2);
      host.appendChild(span);
      document.body.appendChild(host);

      var qsa = host.querySelectorAll('p');
      ok('querySelectorAll instanceof NodeList', qsa instanceof NodeList);
      ok('querySelectorAll not an Array', !Array.isArray(qsa));
      ok('NodeList toString', Object.prototype.toString.call(qsa) === '[object NodeList]');
      ok('NodeList length/item/index', qsa.length === 2 && qsa.item(0) === qsa[0] &&
         qsa.item(0) === p1);
      ok('NodeList forEach', typeof qsa.forEach === 'function' && (function () {
        var seen = [];
        qsa.forEach(function (n, i, list) { seen.push(n === list[i]); });
        return seen.length === 2 && seen[0] && seen[1];
      })());
      ok('NodeList iterable', (function () {
        var names = [];
        for (var n of qsa) names.push(n.id);
        return names.join(',') === 'p1,p2';
      })());
      ok('NodeList static snapshot', (function () {
        host.appendChild(document.createElement('p'));
        return qsa.length === 2;
      })());

      var ch = host.children;
      ok('children instanceof HTMLCollection', ch instanceof HTMLCollection);
      ok('HTMLCollection toString', Object.prototype.toString.call(ch) === '[object HTMLCollection]');
      ok('children identity', host.children === ch);
      ok('children length/item/namedItem', ch.length === 4 && ch.item(0) === p1 &&
         ch.namedItem('p2') === p2);
      ok('HTMLCollection has no forEach', typeof ch.forEach === 'undefined');
      ok('HTMLCollection iterable', (function () {
        var n = 0;
        for (var c of ch) n++;
        return n === 4;
      })());

      var cn = host.childNodes;
      ok('childNodes instanceof NodeList', cn instanceof NodeList);
      ok('childNodes identity', host.childNodes === cn);
      ok('childNodes live', (function () {
        var before = cn.length;
        host.appendChild(document.createTextNode('x'));
        return cn.length === before + 1;
      })());

      var tags = document.getElementsByTagName('p');
      ok('getElementsByTagName instanceof HTMLCollection', tags instanceof HTMLCollection);
      ok('getElementsByTagName identity', document.getElementsByTagName('p') === tags);
      ok('getElementsByTagName live', (function () {
        var before = tags.length;
        host.appendChild(document.createElement('p'));
        return tags.length === before + 1;
      })());

      var byClass = host.getElementsByClassName('a');
      ok('getElementsByClassName live+token', byClass.length === 1 &&
         byClass[0] === p1 &&
         (function () {
           var ab = document.createElement('div');
           ab.className = 'ab';
           host.appendChild(ab);
           return host.getElementsByClassName('a').length === 1;
         })());

      ok('document.forms instanceof HTMLCollection', document.forms instanceof HTMLCollection);
      ok('document.forms identity', document.forms === document.forms);

      var threw = false;
      try { new NodeList(); } catch (e) {
        threw = /Illegal constructor/.test(e.message);
      }
      ok('new NodeList throws', threw);
    })();

    /* ---- A2 (A1 tables): ownership follows Chrome, not the 2008 IDL ---------
     * The generated tables (buildANT/Ant<Interface>.cpp) move the members whose
     * IDL owner Chrome disagrees with: Node.attributes -> Element,
     * Element.style/offset* -> HTMLElement, HTMLElement.id/className/
     * innerHTML/outerHTML/children -> Element. Values probed with
     * tools/chrome_probe.py on 2026-11-10; a generator change that drops the
     * override fails right here. */
    function ownDesc(iface, name) {
      var ctor = window[iface];
      return ctor && ctor.prototype ? Object.getOwnPropertyDescriptor(ctor.prototype, name) : undefined;
    }
    ok('id owned by Element.prototype', !!(ownDesc('Element', 'id') || {}).get &&
       ownDesc('HTMLElement', 'id') === undefined);
    ok('innerHTML owned by Element.prototype', !!(ownDesc('Element', 'innerHTML') || {}).get &&
       ownDesc('HTMLElement', 'innerHTML') === undefined);
    ok('children owned by Element.prototype', !!(ownDesc('Element', 'children') || {}).get &&
       ownDesc('HTMLElement', 'children') === undefined);
    ok('attributes owned by Element.prototype', !!(ownDesc('Element', 'attributes') || {}).get &&
       ownDesc('Node', 'attributes') === undefined);
    ok('localName owned by Element.prototype', !!(ownDesc('Element', 'localName') || {}).get &&
       ownDesc('Node', 'localName') === undefined);
    ok('style owned by HTMLElement.prototype', !!(ownDesc('HTMLElement', 'style') || {}).get &&
       ownDesc('Element', 'style') === undefined);
    ok('offsetWidth owned by HTMLElement.prototype', !!(ownDesc('HTMLElement', 'offsetWidth') || {}).get &&
       ownDesc('Element', 'offsetWidth') === undefined);
    ok('clientWidth stays on Element.prototype', !!(ownDesc('Element', 'clientWidth') || {}).get);
    ok('modern extras on Node.prototype', !!(ownDesc('Node', 'isConnected') || {}).get);
    ok('modern extras on Element.prototype',
       !!(ownDesc('Element', 'classList') || {}).get && !!(ownDesc('Element', 'dataset') || {}).get &&
       !!(ownDesc('Element', 'firstElementChild') || {}).get);
    /* Names that also exist on another interface's IDL (HTMLMediaElement has no
     * 2008 IDL at all, input.multiple/textarea.maxLength/script.async collide by
     * name with other tables): the extras list is keyed by interface, so these
     * must be registered for their own receiver, not dropped as "already known". */
    ok('media element operations', (function () {
      var v = document.createElement('video');
      return typeof v.load === 'function' && typeof v.play === 'function' &&
             typeof v.pause === 'function' && ('src' in v) && ('readyState' in v);
    })());
    ok('name-collision attributes', (function () {
      var i = document.createElement('input'), t = document.createElement('textarea'),
          s = document.createElement('script');
      return ('multiple' in i) && ('maxLength' in t) && ('async' in s);
    })());
    ok('Element.prototype.remove', typeof document.createElement('div').remove === 'function');
    /* A3: IDL attributes the facade had no branch for are answered by reflection
     * (string attributes, boolean attributes by presence, long ones parsed) or
     * by the DOM property where Chrome does that (canvas size, contentEditable). */
    ok('reflected string attribute', (function () {
      var a = document.createElement('a'), f = document.createElement('form');
      a.hreflang = 'en'; f.method = 'post';
      return a.hreflang === 'en' && f.method === 'post' && a.getAttribute('hreflang') === 'en';
    })());
    ok('reflected boolean attribute', (function () {
      var i = document.createElement('input');
      i.disabled = true;
      return i.disabled === true && i.hasAttribute('disabled') === true;
    })());
    ok('reflected long attribute', (function () {
      var t = document.createElement('textarea');
      t.cols = 42;
      return t.cols === 42 && t.getAttribute('cols') === '42';
    })());
    ok('element prefix/localName', (function () {
      var d = document.createElement('div');
      return d.localName === 'div' && d.prefix === null;
    })());
    ok('canvas size is DOM state', (function () {
      var c = document.createElement('canvas');
      return c.width === 300 && c.height === 150;
    })());
    ok('isContentEditable is DOM state', document.createElement('div').isContentEditable === false);
    ok('id accessor on Element.prototype', (function () {
      var d = Object.getOwnPropertyDescriptor(Element.prototype, 'id');
      return !!d && typeof d.get === 'function' && typeof d.set === 'function' &&
             d.enumerable === true && d.configurable === true;
    })());
    ok('style accessor on HTMLElement.prototype',
       typeof Object.getOwnPropertyDescriptor(HTMLElement.prototype, 'style').get === 'function');
    ok('in sees attributes', ('id' in div) && ('onclick' in div) && ('value' in input));
    ok('document attributes on Document.prototype',
       typeof Object.getOwnPropertyDescriptor(Document.prototype, 'title').get === 'function' &&
       typeof Object.getOwnPropertyDescriptor(Document.prototype, 'readyState').get === 'function');
    ok('attribute getter still reflects the DOM', (function () {
      var t = document.createElement('div');
      t.setAttribute('title', 'T');
      return t.title === 'T';
    })());
    ok('attribute setter still writes the DOM', (function () {
      var t = document.createElement('div');
      t.id = 'acc';
      return t.getAttribute('id') === 'acc';
    })());
    ok('reflected boolean via accessor', (function () {
      var t = document.createElement('div');
      t.hidden = true;
      return !!t.hidden === true && t.hasAttribute('hidden');
    })());
    ok('read-only attribute stays read-only', (function () {
      var t = document.createElement('div');
      t.nodeType = 9;
      return t.nodeType === 1 && t.hasOwnProperty('nodeType') === false;
    })());
    ok('expando write still works', (function () {
      var t = document.createElement('div');
      t.__customField = 5;
      return t.__customField === 5;
    })());
    ok('for-in sees attributes', (function () {
      for (var k in div) if (k === 'id') return true;
      return false;
    })());

    /* ---- known gaps (A flips these) --------------------------------------- */
    /* `style` is now a real accessor on HTMLElement.prototype (B2-3), but the
     * object it returns is still the facade shim, not a CSSStyleDeclaration. */
    ok('HTMLElement.prototype.style is an accessor (known gap: value is a shim)',
       typeof Object.getOwnPropertyDescriptor(HTMLElement.prototype, 'style').get === 'function' &&
       !(div.style instanceof CSSStyleDeclaration));
    /* ---- B2: window identity ---------------------------------------------- */
    ok('window instanceof Window', window instanceof Window);
    ok('window proto is Window.prototype', protoIs(window, Window.prototype));
    ok('window toString', Object.prototype.toString.call(window) === '[object Window]');
    ok('window constructor', window.constructor === Window);
    ok('window instanceof EventTarget', window instanceof EventTarget);
    ok('window instanceof Object', window instanceof Object);
    ok('self is window', self === window);
    ok('window has own document', Object.prototype.hasOwnProperty.call(window, 'document'));

    /* ---- B2: event interface objects (Chrome values: issues §18) ---------- */
    ok('new Event instanceof Event', new Event('x') instanceof Event);
    ok('new Event instanceof Object', new Event('x') instanceof Object);
    ok('plain event tag', Object.prototype.toString.call(new Event('x')) === '[object Event]');
    ok('plain event bubbles default', new Event('x').bubbles === false);
    ok('MouseEvent instance chain', (function () {
      var m = new MouseEvent('click', { clientX: 5 });
      return (m instanceof MouseEvent) && (m instanceof UIEvent) && (m instanceof Event) &&
             m.clientX === 5 && m.detail === 0 &&
             Object.prototype.toString.call(m) === '[object MouseEvent]' &&
             m.constructor === MouseEvent;
    })());
    ok('event ctor chain', protoIs(MouseEvent.prototype, UIEvent.prototype) &&
       protoIs(UIEvent.prototype, Event.prototype));
    ok('KeyboardEvent extends UIEvent', new KeyboardEvent('keydown') instanceof UIEvent);
    ok('FocusEvent extends UIEvent', new FocusEvent('f') instanceof UIEvent);
    ok('InputEvent extends UIEvent', new InputEvent('input') instanceof UIEvent);
    ok('WheelEvent extends MouseEvent', new WheelEvent('w') instanceof MouseEvent);
    ok('CustomEvent still Event', new CustomEvent('c', { detail: 3 }) instanceof Event);
    ok('createEvent MouseEvent', document.createEvent('MouseEvent') instanceof MouseEvent);
    ok('createEvent Event', document.createEvent('Event') instanceof Event);

    /* Engine-dispatched click: a real MouseEvent; target/currentTarget are
     * valid while a handler runs and reset afterwards, as in Chrome. */
    (function () {
      var host = document.createElement('div');
      var parent = document.createElement('section');
      document.body.appendChild(parent);
      parent.appendChild(host);
      var inner = null, outer = null, seen = null;
      host.addEventListener('click', function (e) {
        inner = { target: e.target, current: e.currentTarget, phase: e.eventPhase,
                  trusted: e.isTrusted };
        seen = e;
      });
      parent.addEventListener('click', function (e) {
        outer = { target: e.target, current: e.currentTarget, phase: e.eventPhase };
      });
      host.click();
      ok('click instanceof MouseEvent/UIEvent/Event', !!seen &&
         (seen instanceof MouseEvent) && (seen instanceof UIEvent) && (seen instanceof Event));
      ok('click tag/constructor', !!seen &&
         Object.prototype.toString.call(seen) === '[object MouseEvent]' &&
         seen.constructor === MouseEvent);
      /* Chrome marks a scripted el.click() untrusted; this engine cannot tell
       * a user click from a scripted one yet, so engine dispatch is trusted. */
      ok('click engine dispatch trusted', !!inner && inner.trusted === true);
      ok('click target/currentTarget/phase', !!inner && inner.target === host &&
         inner.current === host && inner.phase === 2);
      ok('click bubbles to parent', !!outer && outer.target === host &&
         outer.current === parent && outer.phase === 3);
      ok('currentTarget reset after dispatch', !!seen && seen.currentTarget === null &&
         seen.eventPhase === 0);
    })();

    /* Page-dispatched event: target set, untrusted, cancelable contract. */
    (function () {
      var el = document.createElement('div');
      document.body.appendChild(el);
      var seen = null;
      var ret;
      el.addEventListener('probe', function (e) { seen = e; });
      ret = el.dispatchEvent(new Event('probe', { bubbles: true, cancelable: true }));
      ok('dispatchEvent target/tag', !!seen && seen.target === el &&
         Object.prototype.toString.call(seen) === '[object Event]');
      ok('dispatchEvent untrusted', !!seen && seen.isTrusted === false);
      ok('dispatchEvent return true', ret === true);
      el.addEventListener('probe2', function (e) { e.preventDefault(); });
      ok('dispatchEvent returns false when cancelled',
         el.dispatchEvent(new Event('probe2', { cancelable: true })) === false);
    })();
  } catch (e) {
    fail.push('threw: ' + (e && e.message ? e.message : e));
  }

  window.__bindingResult = { pass: pass, total: total, fail: fail };
})();
</script>
</body>
</html>
