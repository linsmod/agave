<!DOCTYPE html><html><head><meta charset="utf-8"><title>flex cssom</title><style>
  #a { flex: 2 3 40px; }
  #b { flex: 1; }
  #c { flex: auto; }
  #d { flex: none; }
  #e { flex-grow: 4; flex-shrink: .5; flex-basis: 25%; }
  #f { flex-basis: 0; }
  #g { flex-basis: calc(50% - 4px); }
  #h { flex-basis: 33.333%; }
  #t { flex: 1 2 30px; }
  #i { flex: 1 1 calc(50% - 4px); }
  #j { flex: 0 0 calc(25% + 10px); }
</style></head><body>
<div id="a">a</div><div id="b">b</div><div id="c">c</div><div id="d">d</div>
<div id="e">e</div><div id="f">f</div><div id="g">g</div><div id="h">h</div>
<div id="i">i</div><div id="j">j</div>
<div id="t">t</div>
</body></html>
