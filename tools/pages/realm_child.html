<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>child frame</title></head>
<body><div id="c">child</div>
<script>
  window.childVar = 'from-child';
  /* The child's own view of its body: with per-realm wrappers this object must
     differ from what the parent gets for the same node. */
  window.__selfBody = document.body;

  /* A timer of this realm must be restored into THIS realm and THIS document.
     Before R130 __agbFrameSlot() returned the parent's document slot, so the
     first timer callback repointed the child's document object at the parent
     document: document.URL became the parent's and the child's nodes vanished. */
  window.__childTimerUrl = '';
  window.__childTimerMarker = '';
  window.__childTimerDocSame = '';
  (function () {
    var d0 = document, u0 = document.URL;
    setTimeout(function () {
      window.__childTimerUrl = (document.URL === u0) ? 'own' : ('other:' + document.URL);
      window.__childTimerMarker = document.getElementById('c') ? 'found' : 'missing';
      window.__childTimerDocSame = (document === d0 && window.document === d0)
          ? 'same' : 'changed';
    }, 40);
  })();

  /* Browser hosts install timers into every frame realm (P0-l). The child
     must see them during parsing, not just after load. */
  window.__childTimer = typeof setTimeout;
  window.__childInterval = typeof setInterval;
  window.__childTimerWorks = 0;
  if (typeof setTimeout === 'function') {
    setTimeout(function () { window.__childTimerWorks = 1; }, 1);
  }

  /* Frame DOMContentLoaded must fire in the frame's own realm (S3). */
  window.__childDcl = 0;
  document.addEventListener('DOMContentLoaded', function () {
    window.__childDcl = (window.__childDcl || 0) + 1;
  });

  var r = [];
  r.push('selfIsParent=' + (window.parent === window));
  r.push('topArraySame=' + (window.top.Array === Array));
  r.push('parentVar=' + (typeof window.parent.parentVar));
  r.push('parentFn=' + (typeof window.parent.parentFn === 'function'
      ? window.parent.parentFn() : 'missing'));
  r.push('ownArray=ok');
  document.title = r.join(';');
</script>
</body></html>
