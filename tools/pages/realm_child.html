<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>child frame</title></head>
<body><div id="c">child</div>
<script>
  window.childVar = 'from-child';
  /* The child's own view of its body: with per-realm wrappers this object must
     differ from what the parent gets for the same node. */
  window.__selfBody = document.body;

  /* Frame DOMContentLoaded must fire in the frame's own realm (S3). */
  window.__childDcl = 0;
  document.addEventListener('DOMContentLoaded', function () {
    window.__childDcl = (window.__childDcl || 0) + 1;
  });

  var r = [];
  r.push('selfIsParent=' + (window.parent === window));
  r.push('topArraySame=' + (window.top.Array === Array));
  r.push('parentVar=' + (typeof window.parent.parentVar));
  r.push('parentFn=' + (typeof window.parent.parentFn === 'function'
      ? window.parent.parentFn() : 'missing'));
  r.push('ownArray=ok');
  document.title = r.join(';');
</script>
</body></html>
