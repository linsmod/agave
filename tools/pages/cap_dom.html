<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>cap dom</title>
</head>
<body>
<a href="x.html">first link</a>
<img src="none.png" alt="">
<img id="pix" src="cap_pixel.png" alt="" width="1" height="1">
<form action="x.html" method="get">
  <input type="text" name="q" value="1">
  <input type="submit" value="go">
</form>
<p id="p">text</p>
<script>
/* Writes the current DOM/JS API surface into document.title so the probe can
 * report it with:  --eval "probeExit(document.title)"
 * Update docs/capability-gaps.md when a row changes. */
var f = document.getElementsByTagName('form')[0];
var b = document.body;
var pix = document.getElementById('pix');

document.title = [
  'forms=' + document.forms.length,
  'links=' + document.links.length,
  'images=' + document.images.length,
  'anchors=' + document.anchors.length,
  'scripts=' + document.scripts.length,
  'all=' + document.getElementsByTagName('*').length,
  'formSubmit=' + typeof f.submit,
  'formAction=' + typeof f.action,
  'imgComplete=' + (pix ? String(pix.complete) : 'none'),
  'imgNatural=' + (pix ? String(pix.naturalWidth) : 'none'),
  'imgWidth=' + (pix ? String(pix.width) : 'none'),
  'insertAdjacentHTML=' + typeof b.insertAdjacentHTML,
  'innerText=' + typeof b.innerText,
  'classListAdd=' + (b.classList ? typeof b.classList.add : 'none'),
  'classListReplace=' + (b.classList ? typeof b.classList.replace : 'none'),
  'matches=' + typeof b.matches,
  'closest=' + typeof b.closest,
  'textContent=' + typeof b.textContent,
  /* --- wave 1-3 (2026-11-04): tree navigation, attributes, mutation --- */
  'parentElement=' + typeof b.parentElement,
  'firstElementChild=' + typeof b.firstElementChild,
  'nextElementSibling=' + typeof b.nextElementSibling,
  'isConnected=' + typeof b.isConnected,
  'getRootNode=' + typeof b.getRootNode,
  'getAttributeNames=' + typeof b.getAttributeNames,
  'toggleAttribute=' + typeof b.toggleAttribute,
  'replaceChildren=' + typeof b.replaceChildren,
  'scrollIntoView=' + typeof b.scrollIntoView,
  'offsetParent=' + typeof b.offsetParent,
  'nodeValue=' + typeof b.firstChild.nodeValue,
  'tabIndex=' + typeof b.tabIndex,
  'hidden=' + typeof b.hidden,
  /* --- form / img / frame / document --- */
  'formElements=' + (f.elements ? f.elements.length : 'none'),
  'imgDecode=' + (pix ? typeof pix.decode : 'none'),
  'iframeCw=' + (function () {
      var fr = document.createElement('iframe');
      document.body.appendChild(fr);
      var ok = (fr.contentDocument !== undefined) && (fr.contentWindow !== undefined);
      document.body.removeChild(fr);
      return ok ? 'yes' : 'no';
  })(),
  'activeElement=' + typeof document.activeElement,
  'hasFocus=' + typeof document.hasFocus,
  'visibilityState=' + typeof document.visibilityState,
  'fonts=' + (document.fonts ? typeof document.fonts.ready : 'none'),
  'importNode=' + typeof document.importNode,
  'elementFromPoint=' + typeof document.elementFromPoint,
  /* --- navigator surface (R81: UA sniffers call javaEnabled() unconditionally) --- */
  'navJava=' + typeof navigator.javaEnabled,
  'navJavaResult=' + (typeof navigator.javaEnabled === 'function' ? String(navigator.javaEnabled()) : 'none'),
  'navLang=' + typeof navigator.language,
  'navProduct=' + typeof navigator.product,
  'navPlatform=' + typeof navigator.platform,
  'navPlugins=' + (navigator.plugins ? navigator.plugins.length : 'none')
].join(' ');
</script>
</body>
</html>
