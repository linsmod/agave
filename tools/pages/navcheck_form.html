<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>navcheck form</title>
</head>
<body>
<form action="navcheck_target.html" method="get">
  <input type="text" name="q" value="hello">
  <input type="submit" value="go">
</form>
<script>
setTimeout(function () {
  /* form.submit() is not bridged yet (document.forms is empty too), but a
   * click on the submit button reaches WebCore's default form action. */
  document.getElementsByTagName('input')[1].click();
}, 50);
</script>
</body>
</html>
