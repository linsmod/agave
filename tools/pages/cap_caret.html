<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>caret</title>
<style>
html, body { margin: 0; background: rgb(255, 255, 255) }

/* The caret of a text field is as tall as the text, not as the line box:
 * Chrome paints a ~17px caret for a 14px font even when line-height is 25px.
 * tools/run_typing_tests.ps1 measures it with AGB_CARET_DEBUG=1 (which paints
 * the caret red, always, so a headless screenshot has one). */
#a, #b {
    display: block;
    width: 200px;
    height: 25px;
    margin: 10px;
    padding: 0;
    border: 1px solid rgb(0, 0, 0);
    background: rgb(255, 255, 255);
    color: rgb(0, 0, 0);
    font-size: 14px;
}
#a { line-height: 25px }
#b { line-height: 25px }
</style>
</head>
<body>
<input id="a">
<input id="b">
</body>
</html>
