<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>cap css</title>
<style>
#g  { display: grid; }
#t  { transform: translateX(10px); }
#s  { box-shadow: 0 0 4px red; }
#st { position: sticky; top: 0; }
#ar { aspect-ratio: 16 / 9; width: 160px; }
#fx { display: flex; gap: 8px; }
#fx > div { width: 20px; height: 10px; }
#is:is(p) { color: rgb(1, 2, 3); }
#wh:where(p) { color: rgb(4, 5, 6); }
#var { color: var(--missing, rgb(7, 8, 9)); }
/* Custom properties cascade per element and inherit (R39). */
:root { --cap-c: rgb(1, 2, 3); }
#varcascade { --cap-c: rgb(9, 8, 7); color: var(--cap-c); }
#varinherit { color: var(--cap-c); }
/* Unprefixed box-sizing used to be dropped entirely (R39). */
#bs { box-sizing: border-box; width: 100px; padding: 10px; border: 1px solid rgb(0, 0, 0); }
/* flex items are blockified: an inline <span> must get the width/height (R39). */
#fxb { display: flex; width: 200px; height: 40px; align-items: center; }
#fxb > span { width: 20px; height: 10px; background-color: rgb(0, 0, 0); }
/* `safe center` must not make the whole declaration fail (R42): the alignment
 * keyword after the overflow keyword is what this engine has to honour. */
#safe { display: flex; width: 200px; height: 40px; align-items: safe center; }
#safe > span { width: 20px; height: 10px; background-color: rgb(0, 0, 0); }
/* Absolute children of a column flex container take their static position
 * from align-items (R42) - the child must be horizontally centred. */
#absParent { display: flex; flex-direction: column; align-items: center; position: relative; width: 200px; height: 60px; }
#absChild { position: absolute; bottom: 0; width: 40px; height: 10px; }
/* media queries: a bare expression and a colour-scheme one (R39). */
#mq { width: 10px; height: 10px; }
@media (min-width: 1px) { #mq { border-top: 2px solid rgb(3, 3, 3); } }
@media (prefers-color-scheme: dark) { #mq { background-color: rgb(0, 0, 200); } }
@media (prefers-color-scheme: light) { #mq { background-color: rgb(200, 0, 0); } }
/* calc() constant folding (R43): the feedback bar's min-height comes from
 * calc(var(--lh) + 4px) in a custom property; mixed-unit calc stays dropped. */
:root { --cap-lh: 18px; }
#calcfb { min-height: calc(18px + 4px); }
#calcvar { --cap-fb: calc(var(--cap-lh) + 4px); min-height: var(--cap-fb); }
#calcmixed { min-height: calc(100% - 24px); }
</style>
</head>
<body>
<div id="g">grid</div>
<div id="t">transform</div>
<div id="s">shadow</div>
<div id="st">sticky</div>
<div id="ar">ratio</div>
<div id="fx"><div>a</div><div>b</div></div>
<p id="is">is</p>
<p id="wh">where</p>
<div id="var">var</div>
<div id="varcascade">varcascade</div>
<div id="varinherit">varinherit</div>
<div id="bs">bs</div>
<div id="fxb"><span></span></div>
<div id="safe"><span></span></div>
<div id="absParent"><div id="absChild"></div></div>
<div id="mq">mq</div>
<div id="calcfb"></div>
<div id="calcvar"></div>
<div id="calcmixed"></div>
<script>
/* Same contract as cap_dom.html: report through document.title. */
function cs(id) { return getComputedStyle(document.getElementById(id)); }

document.title = [
  'grid=' + cs('g').display,
  'transform=[' + cs('t').transform + ']',
  'boxShadow=' + cs('s').boxShadow,
  'sticky=' + cs('st').position,
  'aspectHeight=' + cs('ar').height,
  'gap=' + cs('fx').gap,
  'isColor=' + cs('is').color,
  'whereColor=' + cs('wh').color,
  'varColor=' + cs('var').color,
  'varCascade=' + cs('varcascade').color,
  'varInherit=' + cs('varinherit').color,
  'boxSizing=' + cs('bs').boxSizing,
  'boxWidth=' + document.getElementById('bs').getBoundingClientRect().width,
  'flexItemW=' + document.querySelector('#fxb > span').getBoundingClientRect().width,
  'safeAlign=' + cs('safe').getPropertyValue('align-items'),
  'safeItemY=' + Math.round(document.querySelector('#safe > span').getBoundingClientRect().top),
  'absChildX=' + Math.round(document.getElementById('absChild').getBoundingClientRect().left),
  'calcMinH=' + cs('calcfb').getPropertyValue('min-height'),
  'calcVarMinH=' + cs('calcvar').getPropertyValue('min-height'),
  'calcMixed=' + cs('calcmixed').getPropertyValue('min-height'),
  'bareMedia=' + cs('mq').borderTopWidth,
  'schemeBg=' + cs('mq').backgroundColor,
  'mediaDark=' + (matchMedia('(prefers-color-scheme: dark)').matches ? 1 : 0),
  'mediaMin=' + (matchMedia('(min-width: 1px)').matches ? 1 : 0)
].join(' ');
</script>
</body>
</html>
