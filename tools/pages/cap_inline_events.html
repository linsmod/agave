<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>inline event handler attributes</title>
</head>
<body>
<!-- Inline content attributes must be compiled and run (they used to be
     parsed into the DOM but never registered with the ant event table). -->
<textarea id="t"
  onkeydown="window.hits = (window.hits || 0) + 1"></textarea>
<textarea id="p"
  onkeydown="window.phits = (window.phits || 0) + 1; event.preventDefault();"></textarea>
<button id="b" onclick="window.clicked = (window.clicked || 0) + 1">go</button>
</body>
</html>
