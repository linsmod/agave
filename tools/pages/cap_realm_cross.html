<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>cross parent</title></head>
<body>
<div id="p">parent</div>
<script>
  /* A 10ms interval keeps firing while the child realm exists: a timer of one
     realm must not repoint the other realm's document/location/history. */
  window.__parentHist = history.length;
  setInterval(function () {}, 10);

  var f = document.createElement('iframe');
  f.id = 'fr';
  f.src = 'cap_realm_cross_child.html?x=1';
  document.body.appendChild(f);
</script>
</body></html>
