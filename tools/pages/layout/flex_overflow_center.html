<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>flex overflow centering</title>
<style>
html, body { margin: 0 }

/* A single-line flex container with a definite height. CSS Flexbox puts the
 * line at the container's inner height, so an item that is taller than the box
 * is centred and sticks out top and bottom by the same amount; align-items
 * centres inside that line. The 2008 line sizer used the tallest item instead,
 * which parked everything at the content top (DeepSeek's login input: 48px
 * prefix inside a 48px box, 6px too low). */
#row {
    display: flex;
    align-items: center;
    box-sizing: border-box;
    width: 300px;
    height: 48px;
    padding: 0 10px;
    border: 1px solid rgb(0, 0, 0);
    background: rgb(240, 240, 240);
}

#tall {
    width: 26px;
    height: 48px;
    margin: 5px;
    background: rgb(200, 200, 200);
}

#short {
    width: 100px;
    height: 25px;
    background: rgb(120, 120, 120);
}

/* align-items:flex-end must also be measured against the container's line,
 * not against the tallest item. */
#rowEnd {
    display: flex;
    align-items: flex-end;
    box-sizing: border-box;
    width: 300px;
    height: 48px;
    padding: 0 10px;
    border: 1px solid rgb(0, 0, 0);
}

#endTall {
    width: 26px;
    height: 40px;
    background: rgb(200, 200, 200);
}

#endShort {
    width: 40px;
    height: 20px;
    background: rgb(120, 120, 120);
}
</style>
</head>
<body>
<div id="row" data-case="row">
    <div id="tall" data-case="tall" data-props="margin-top,margin-left,width,height"></div>
    <div id="short" data-case="short" data-props="margin-top,width,height"></div>
</div>
<div id="rowEnd" data-case="rowEnd">
    <div id="endTall" data-case="endTall"></div>
    <div id="endShort" data-case="endShort"></div>
</div>
</body>
</html>
