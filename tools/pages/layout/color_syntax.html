<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>color function syntax</title>
<style>
  html, body { margin: 0; padding: 0; }
  .sw { width: 40px; height: 20px; display: block; margin-bottom: 2px; }
  :root {
    --hue: 200;
    --sat: 60%;
    --hue-sat: 200 60%;
    --bg-full: hsl(var(--hue-sat) 20%);
  }
  /* legacy comma form */
  #c1 { background-color: hsl(200, 60%, 20%); }
  #c2 { background-color: rgb(20, 61, 81); }
  /* CSS Color 4 space form */
  #c3 { background-color: hsl(200 60% 20%); }
  #c4 { background-color: rgb(20 61 81); }
  /* percentages and angle units */
  #c5 { background-color: rgb(8% 24% 32%); }
  #c6 { background-color: hsl(200deg 60% 20%); }
  /* var() substitution, including a bare number component */
  #c7 { background-color: hsl(var(--hue) 60% 20%); }
  #c8 { background-color: hsl(var(--hue) var(--sat) 20%); }
  #c9 { background-color: var(--bg-full); }
  /* the pattern that showed up on css3test: a variable holding "hue saturation" */
  #c10 { background-color: hsl(var(--hue-sat) 20%); }
  /* negative / wrapped hue */
  #c11 { background-color: hsl(-160 60% 20%); }
  /* hex and #RRGGBBAA still work */
  #c12 { background-color: #143d51; }
  #c13 { background-color: #143d5180; }
</style>
</head>
<body>
<div id="c1" class="sw" data-case="c1" data-props="background-color"></div>
<div id="c2" class="sw" data-case="c2" data-props="background-color"></div>
<div id="c3" class="sw" data-case="c3" data-props="background-color"></div>
<div id="c4" class="sw" data-case="c4" data-props="background-color"></div>
<div id="c5" class="sw" data-case="c5" data-props="background-color"></div>
<div id="c6" class="sw" data-case="c6" data-props="background-color"></div>
<div id="c7" class="sw" data-case="c7" data-props="background-color"></div>
<div id="c8" class="sw" data-case="c8" data-props="background-color"></div>
<div id="c9" class="sw" data-case="c9" data-props="background-color"></div>
<div id="c10" class="sw" data-case="c10" data-props="background-color"></div>
<div id="c11" class="sw" data-case="c11" data-props="background-color"></div>
<div id="c12" class="sw" data-case="c12" data-props="background-color"></div>
<div id="c13" class="sw" data-case="c13" data-props="background-color"></div>
<div style="height:1200px"></div>
</body>
</html>
