<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>flex: an auto-height container shrinks back after its content shrinks</title>
<style>
  html, body { margin: 0; padding: 0; }
  body { font: 12px Arial; }
  .page { height: 760px; display: flex; flex-direction: column; align-items: stretch; }
  .center { flex-grow: 1; flex-shrink: 0; display: flex; flex-direction: column;
            justify-content: center; align-items: flex-start; }
  .card { min-height: 444px; padding-top: 40px; padding-bottom: 40px;
          display: flex; flex-direction: column; align-items: center; }
  .icon { width: 182px; height: 28px; background: #ddd; }
  .row { display: flex; align-items: stretch; gap: 32px; }
  .hero { width: 336px; display: flex; flex-direction: column; flex-grow: 1; }
  .item { height: 70px; background: #eef; }
  .agree { flex-grow: 1; margin-bottom: 24px; background: #fee; }
  .btn { height: 42px; background: #efe; }
  .social { height: 18px; margin-top: 16px; background: #ffe; }
  .col { box-sizing: border-box; flex: 0 0 240px; align-self: stretch;
         width: 240px; min-width: 0; display: flex; }
  .block { flex-grow: 1; padding: 32px 0 24px; box-sizing: border-box; background: #eee; }
  .desc { height: 20px; }
  .qr { width: 200px; height: 200px; background: #ccc; }
</style>
</head>
<body>

<!-- The DeepSeek sign-in card, reduced: a QR column that is taller than the
     hero for a moment, then shrinks back. Every container here is
     height:auto, so each layout must be sized by the *current* content.
     R113: m_preFlexHeight kept the previous (stretched) height, so the row -
     and with it the agreement box, which has flex-grow:1 - never shrank. -->

<div class="page"><div class="center"><div class="card" id="card" data-case="card">
  <div class="icon"></div>
  <div class="row" id="row" data-case="row">
    <div class="hero" data-case="hero">
      <div class="item"></div><div class="item"></div>
      <div class="agree" id="agree" data-case="agree">注册登录即代表已阅读并同意我们的 用户协议 与 隐私政策</div>
      <div class="btn"></div><div class="social"></div>
    </div>
    <div class="col" data-case="col"><div class="block" id="block" data-case="block">
      <div class="desc"></div><div class="qr"></div>
    </div></div>
  </div>
</div></div></div>

<script>
(function () {
  var block = document.getElementById('block');
  var extra = document.createElement('div');
  extra.style.height = '200px';
  block.appendChild(extra);
  void document.body.offsetHeight;
  block.removeChild(extra);
  void document.body.offsetHeight;
}());
</script>
</body>
</html>
