<!DOCTYPE html><html><head><meta charset="utf-8"><title>carbon float</title><style>
  html, body { margin: 0; padding: 0; }
  #ad {
    width: 245px;
    display: block; overflow: hidden; padding: 12px;
    border: solid 1px #ccc; background-color: #fafafa;
    font-size: 12px; line-height: 1.5;
  }
  #ad span { position: relative; display: block; overflow: hidden; }
  .carbon-img { float: left; margin-right: 12px; display: block; }
  .carbon-img img { display: block; }
  .carbon-text { display: block; float: left; max-width: calc(100% - 130px - 1em); text-align: left; }
  .carbon-poweredby { position: absolute; right: 0; bottom: 0; display: block; font-size: 10px; }
</style></head>
<body>
<div id="ad">
  <span id="wrap">
    <a id="img" class="carbon-img" data-case="img"><img id="pic" src="noise10.png" width="130" height="100" alt=""></a>
    <a id="text" class="carbon-text" data-case="text" data-props="max-width,width">Design and Development tips in your inbox. Every weekday.</a>
  </span>
  <a id="pby" class="carbon-poweredby">ads via Carbon</a>
</div>
<div style="height:1200px"></div>
</body></html>
