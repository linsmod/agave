<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>box-shadow must not accumulate across partial repaints</title>
<style>
  html, body { height: 100%; margin: 0; background: #ffffff; }
  input {
    position: absolute; left: 40px; width: 400px; height: 40px;
    border: 0; background: #ffffff; font-size: 16px;
    box-shadow: 0 10px 40px 4px rgba(0, 0, 0, 0.25);
  }
  #still { top: 40px; }
  #typed { top: 160px; }
</style>
</head>
<body>
<input id="still" value="static">
<input id="typed" value="static">
<script>
  /* Repaint the second box many times while its value changes: the shadow is
     translucent, and a partial repaint that re-applies it outside the dirty
     clip makes it darker every time (R191). */
  var typed = document.getElementById('typed');
  var ticks = 0;
  var timer = setInterval(function () {
    typed.value += 'x';
    if (++ticks >= 40) clearInterval(timer);
  }, 30);
</script>
</body>
</html>
