<!DOCTYPE html><html><head><meta charset="utf-8"><title>footer flex wrap</title><style>
  html, body { margin: 0; padding: 0; }
  .col { display: flex; flex-direction: column; align-items: center; width: 600px; background: #eee; }
  .foot { display: flex; justify-content: center; flex-wrap: wrap; background: #ddd; }
  /* out-of-flow zero-size child, like the footer links' sentinel spans */
  .hid { position: fixed; opacity: 0; width: 0; height: 0; display: block; }
  /* negative margins: the links pull themselves together; the line breaker
     must count them (R122) or the row wraps even though it fits */
  .foot a { display: block; text-decoration: none; margin: -2px -3px; }
  .bar { display: block; height: 10px; background: #333; }
  .sep { display: block; width: 10px; height: 10px; background: #666; }
</style></head><body>
<div class="col">
  <div class="foot" data-case="foot">
    <a href="#" data-case="a1"><span class="hid"></span><span class="bar" style="width:80px"></span></a>
    <span class="sep" data-case="sep"></span>
    <a href="#" data-case="a2"><span class="hid"></span><span class="bar" style="width:40px"></span></a>
  </div>
</div>
</body></html>
