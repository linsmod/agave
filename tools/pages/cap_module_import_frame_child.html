<!doctype html><meta charset="utf-8"><title>module import frame child</title>
<!-- P1-e: an iframe's module scripts must run, and import() in a classic script
     must resolve against that script's URL (per frame realm). -->
<script>
var marker = 1;
setTimeout(function () {
    import('./cap_module_import_shared.js').then(function (m) {
        window.__dynImport = m.bump();
    }, function (e) {
        window.__dynImport = -1;
    });
}, 0);
</script>
<script type="module">
window.__inlineModule = 1;
</script>
