<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>realm parent</title></head>
<body><div id="p">parent</div>
<script>
  window.parentVar = 'from-parent';
  window.parentFn = function () { return 'PF-ok'; };

  /* The parent's DCL must run exactly once: an iframe finishing must not
     re-run it (that used to double-run suites on pages with ad iframes). */
  window.__parentDcl = 0;
  document.addEventListener('DOMContentLoaded', function () {
    window.__parentDcl = (window.__parentDcl || 0) + 1;
  });

  var f = document.createElement('iframe');
  f.id = 'fr';
  f.src = 'realm_child.html';
  document.body.appendChild(f);
</script>
</body></html>
